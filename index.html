/* ——— Projets (positions dans le couloir, côté du mur, fenêtre de défilement) ——— */
const PROJECTS = [
  { id: "n1", num: "I", title: "CTA Campaign Manager", lvl: "l1", pitch: "p1", pts: ["p1a", "p1b", "p1c"], note: "note1",
    chips: ["FastAPI", "PostgreSQL", "SQLAlchemy", "Alembic", "JWT", "Next.js", "TypeScript", "Tailwind"],
    href: "https://github.com/TeddyRhim/cta-campaign-manager",
    imgs: ["media/cta-1.jpg?v=2", "media/cta-2.jpg?v=2", "media/cta-3.jpg?v=2"], side: 1, z: -24, win: [0.20, 0.36] },
  { id: "n2", num: "II", title: "Assistant candidatures", lvl: "l2", pitch: "p2", pts: ["p2a", "p2b", "p2c"], note: "note2",
    chips: ["Python", "Streamlit", "SQLite", "REST APIs", "uv", "pytest", "ruff"],
    href: "https://github.com/TeddyRhim/assistant-candidature",
    imgs: ["media/assistant-2.jpg?v=2", "media/assistant-1.jpg?v=2"], side: -1, z: -48, win: [0.44, 0.60] },
  { id: "n3", num: "III", title: "Chatbot IA", lvl: "l3", pitch: "p3", pts: ["p3a", "p3b", "p3c"], note: "note3",
    chips: ["Python", "Ollama", "ChromaDB", "RAG", "Embeddings", "Streamlit"],
    href: "https://github.com/TeddyRhim/ChatbotIA",
    imgs: ["media/chatbot-1.jpg?v=2", "media/chatbot-2.jpg?v=2"], side: 1, z: -72, win: [0.68, 0.84] },
];

const $ = id => document.getElementById(id);
const clamp01 = v => Math.min(1, Math.max(0, v));
let lang = "fr";
let amb = null, lastT = performance.now();
try { const s = localStorage.getItem("lang"); lang = s === "en" || s === "fr" ? s : (navigator.language || "fr").toLowerCase().startsWith("fr") ? "fr" : "en"; } catch (e) {}

/* ——— Panneaux ——— */
const panelsEl = $("panels");
const panels = PROJECTS.map(pr => {
  const el = document.createElement("section");
  el.className = "panel " + (pr.side === 1 ? "left" : "right");
  el.setAttribute("aria-label", pr.title);
  el.innerHTML = `<div class="lvl" data-t="${pr.lvl}"></div><h2>${pr.title}</h2><p class="pitch" data-t="${pr.pitch}"></p>
    <p class="sub" data-t="sub"></p><ul>${pr.pts.map(k => `<li data-t="${k}"></li>`).join("")}</ul>
    <div class="chips">${pr.chips.map(c => `<span>${c}</span>`).join("")}</div>
    <div class="row"><button type="button" class="btn" data-shots="${pr.id}" data-t="shots"></button>
    <a class="btn" href="${pr.href}" target="_blank" rel="noopener" data-t="code"></a></div>
    <p class="note" data-t="${pr.note}"></p>`;
  panelsEl.appendChild(el);
  return el;
});

const aboutEl = document.createElement("section");
aboutEl.className = "panel right"; aboutEl.setAttribute("aria-labelledby", "aTitleH");
aboutEl.innerHTML = `<div class="lvl" data-t="lAbout"></div><h2 id="aTitleH" data-t="aTitle"></h2><p class="pitch" data-t="aPitch"></p>
  <p class="sub" data-t="aSub"></p><ul><li data-t="a1"></li><li data-t="a2"></li><li data-t="a3"></li><li data-t="a4"></li></ul>
  <div class="chips">${["PHP", "Symfony", "Python", "FastAPI", "Next.js", "PostgreSQL", "Docker", "Vue.js"].map(c => `<span>${c}</span>`).join("")}</div>
  <div class="row"><a class="btn" href="cv/teddy-rhim-cv.pdf" data-cv download data-t="cv"></a>
  <a class="btn" href="https://github.com/TeddyRhim" target="_blank" rel="noopener" data-t="aGit"></a>
  <a class="btn" href="https://www.linkedin.com/in/teddy-rhim" target="_blank" rel="noopener">LinkedIn</a></div>
  <p class="note" data-t="aNote"></p>`;
panelsEl.appendChild(aboutEl);

/* Navigation : correspondance entre le défilement et la position dans la scène (une halte « à propos » est étirée) */
const SC = [0, 0.10, 0.12, 0.17, 0.20, 1], SP = [0, 0.12, 0.14, 0.155, 0.19, 1];
const interp = (x, xs, ys) => { let i = 0; while (i < xs.length - 2 && x > xs[i + 1]) i++; const t = clamp01((x - xs[i]) / (xs[i + 1] - xs[i])); return ys[i] + (ys[i + 1] - ys[i]) * t; };
const WP = [["nAbout", 0.147], ["n1", 0.28], ["n2", 0.52], ["n3", 0.76], ["nContact", 0.97]];
const wpEl = $("wp");
const wpBtns = WP.map(([k, sp]) => {
  const b = document.createElement("button"); b.type = "button"; b.dataset.t = k;
  b.addEventListener("click", () => { const m = document.documentElement.scrollHeight - innerHeight; scrollTo({ top: interp(sp, SP, SC) * m, behavior: "smooth" }); });
  wpEl.appendChild(b); return b;
});

function setLang(l) {
  lang = l; document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = T[l][e.dataset.t]; });
  $("role").textContent = T[l].role; $("cue").textContent = T[l].cue; $("lightLink").textContent = T[l].light; $("loading").textContent = T[l].loading; $("skipLink").textContent = T[l].skip; $("galX").setAttribute("aria-label", T[l].close); $("galPrev").setAttribute("aria-label", T[l].prev); $("galNext").setAttribute("aria-label", T[l].next); if (typeof updSnd === "function") updSnd(); if (typeof renderShot === "function" && !$("gallery").hidden) renderShot(); document.querySelectorAll("[data-cv]").forEach(e => { e.href = l === "en" ? "cv/teddy-rhim-cv-en.pdf" : "cv/teddy-rhim-cv.pdf"; }); wpEl.setAttribute("aria-label", T[l].navLabel);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  document.title = "Teddy Rhim — " + T[l].role;
  try { localStorage.setItem("lang", l); } catch (e) {}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
setLang(lang);

/* Easter egg : trois clics rapides sur T·R changent de style (version « dessinée ») */
{ let n = 0, tm = 0;
  $("mark").addEventListener("click", e => { e.preventDefault(); n++; clearTimeout(tm); tm = setTimeout(() => { n = 0; }, 900);
    if (n >= 3) { const u = new URL(location.href); if (u.searchParams.has("toon")) u.searchParams.delete("toon"); else u.searchParams.set("toon", ""); location.href = u.toString().replace("toon=", "toon"); } });
}

/* ——— Galerie des captures ——— */
const gal = $("gallery"), galImg = $("galImg"), galThumbs = $("galThumbs"), tip = $("tip");
let gi = 0, gk = 0, lastFocus = null, galTimer = 0;
function renderShot() {
  const pr = PROJECTS[gi], n = pr.imgs.length, src = pr.imgs[gk];
  $("galLvl").textContent = T[lang][pr.lvl]; $("galTitle").textContent = pr.title;
  $("galCap").innerHTML = `<b>${gk + 1} / ${n}</b>${T[lang]["alt" + (gi + 1)]} ${T[lang][pr.note]}`;
  $("galPrev").disabled = gk === 0; $("galNext").disabled = gk === n - 1;
  galThumbs.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-current", k === gk ? "true" : "false"));
  if (galImg.getAttribute("src") !== src) {
    galImg.style.opacity = 0;
    const im = new Image(); im.onload = () => { galImg.src = src; galImg.alt = T[lang]["alt" + (gi + 1)]; galImg.style.opacity = 1; }; im.src = src;
  }
}
function openGallery(i, k = 0) {
  gi = i; gk = k; lastFocus = document.activeElement; clearTimeout(galTimer);
  galThumbs.innerHTML = PROJECTS[i].imgs.map((u, n) => `<button type="button" aria-label="${n + 1}"><img src="${u}" alt=""></button>`).join("");
  galThumbs.querySelectorAll("button").forEach((b, n) => b.addEventListener("click", () => { gk = n; renderShot(); }));
  galImg.removeAttribute("src"); renderShot();
  gal.hidden = false; document.body.classList.add("gal-open"); tip.classList.remove("on");
  requestAnimationFrame(() => { gal.classList.add("on"); $("galX").focus(); });
}
function closeGallery() {
  gal.classList.remove("on"); document.body.classList.remove("gal-open");
  galTimer = setTimeout(() => { gal.hidden = true; }, 350);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
const step = d => { const n = PROJECTS[gi].imgs.length; gk = Math.min(n - 1, Math.max(0, gk + d)); renderShot(); };
$("galX").addEventListener("click", closeGallery);
$("galPrev").addEventListener("click", () => step(-1)); $("galNext").addEventListener("click", () => step(1));
gal.addEventListener("click", e => { if (e.target === gal || e.target.id === "galStage") closeGallery(); });
gal.addEventListener("wheel", e => e.preventDefault(), { passive: false });
{ let x0 = null;
  $("galStage").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  $("galStage").addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); x0 = null; }, { passive: true }); }
addEventListener("keydown", e => {
  if (gal.hidden || !gal.classList.contains("on")) return;
  if (e.key === "Escape") { e.preventDefault(); closeGallery(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  else if ([" ", "PageUp", "PageDown", "Home", "End", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
  else if (e.key === "Tab") {
    const f = [...gal.querySelectorAll("button:not([disabled])")];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
document.querySelectorAll("[data-shots]").forEach(b => b.addEventListener("click", () => openGallery(PROJECTS.findIndex(p => p.id === b.dataset.shots))));

/* ——— Ambiance sonore (coupée par défaut : un clic sur le bouton l'active) ——— */
function updSnd() { const b = $("snd"); b.textContent = amb && amb.on ? T[lang].sndOn : T[lang].sndOff; b.setAttribute("aria-pressed", String(!!(amb && amb.on))); }
{
  const b = $("snd"); b.hidden = false; updSnd();
  b.addEventListener("click", async () => {
    if (!amb) { const m = await import("./audio.js?v=8"); amb = m.createAmbience(); if (!amb) { b.hidden = true; return; } window.__snd = amb; }
    await amb.enable(!amb.on); updSnd();
  });
}

/* ——— Boucle ——— */
const hero = $("hero"), contact = $("contact"), contactBtns = [...contact.querySelectorAll(".btn")];
const pointer = { x: innerWidth / 2, y: innerHeight / 2 };
addEventListener("pointermove", e => { pointer.x = e.clientX; pointer.y = e.clientY; }, { passive: true });
const gNum = $("gNum"), gDepth = $("gDepth"), gFill = $("gFill"), loading = $("loading");
const progress = () => { const m = document.documentElement.scrollHeight - innerHeight; return m > 0 ? interp(clamp01(scrollY / m), SC, SP) : 0; };
const win = (p, a, b, f = 0.03) => clamp01((p - a) / f) * clamp01((b - p) / f);

let first = true, lastAct = -2;
try {
  startScene({
    canvas: $("gl"),
    projects: PROJECTS,
    getProgress: progress,
    style: q.has("toon") ? "toon" : "modern",
    onPaintingClick: i => openGallery(i),
    onPaintingHover: i => { if (i >= 0) { tip.textContent = T[lang].tip; tip.classList.add("on"); } else tip.classList.remove("on"); },
    onFrame(p) {
      if (first) { first = false; loading.classList.add("off"); }
      if (amb) { const n = performance.now(); amb.setProgress(p); amb.tick(Math.min(0.1, (n - lastT) / 1000)); lastT = n; }
      tip.style.transform = `translate(${pointer.x + 16}px, ${pointer.y + 20}px)`;
      hero.style.opacity = String(clamp01(1 - p * 11));
      gFill.style.height = (p * 100) + "%";
      gDepth.textContent = "−" + Math.round(p * 66) + " m";
      PROJECTS.forEach((pr, i) => {
        const o = win(p, pr.win[0], pr.win[1]), el = panels[i];
        el.style.opacity = o.toFixed(3);
        el.style.visibility = o > 0.01 ? "visible" : "hidden";
        el.classList.toggle("live", o > 0.7);
      });
      const ao = win(p, 0.12, 0.175, 0.02);
      aboutEl.style.opacity = ao.toFixed(3); aboutEl.style.visibility = ao > 0.01 ? "visible" : "hidden"; aboutEl.classList.toggle("live", ao > 0.7);
      const act = p < 0.12 ? -1 : p < 0.21 ? 0 : p < 0.41 ? 1 : p < 0.63 ? 2 : p < 0.88 ? 3 : 4;
      if (act !== lastAct) {
        lastAct = act; wpBtns.forEach((b, i) => b.setAttribute("aria-current", i === act ? "true" : "false"));
        const names = [T[lang].aTitle, PROJECTS[0].title, PROJECTS[1].title, PROJECTS[2].title, T[lang].cTitle];
        if (act >= 0) $("live").textContent = names[act];
      }
      const num = p < 0.2 ? "0" : p < 0.4 ? "I" : p < 0.62 ? "II" : p < 0.86 ? "III" : "IV";
      gNum.textContent = num;
      const co = win(p, 0.9, 1.2, 0.04);
      contact.style.opacity = co.toFixed(3);
      contact.style.visibility = co > 0.01 ? "visible" : "hidden";
      contact.classList.toggle("live", co > 0.7);
      if (co > 0.3) contactBtns.forEach(b => {
        const r = b.getBoundingClientRect();
        const d = Math.hypot(pointer.x - (r.left + r.width / 2), pointer.y - (r.top + r.height / 2));
        b.style.setProperty("--near", Math.max(co * 0.35, 1 - d / 280).toFixed(3));
      });
    },
  });
} catch (e) {
  console.error(e);
  location.replace(LIGHT);
}
// filet de sécurité : si la scène met trop longtemps, on propose la version légère
setTimeout(() => { if (first) loading.innerHTML = `${T[lang].loading}<br><a href="${LIGHT}" style="color:var(--gold);font-size:16px;font-style:normal">${T[lang].light}</a>`; }, 15000);
</script>
