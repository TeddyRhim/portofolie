name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : la CI lit le code, elle n'écrit rien sur le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Fichiers référencés présents et numéros de cache cohérents
        run: python scripts/check_refs.py
      - name: Textes FR/EN complets et sans dérive entre les deux versions
        run: python scripts/check_textes.py
