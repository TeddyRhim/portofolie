name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : la CI lit le code, elle n'écrit rien sur le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Fichiers référencés présents et numéros de cache cohérents
        run: python scripts/check_refs.py
